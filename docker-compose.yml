services:
  yeopjan:
    build: .
    ports:
      - "3000:3000"
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      DISCONNECT_GRACE_MS: ${DISCONNECT_GRACE_MS:-3000}
    volumes:
      - yeopjan-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  yeopjan-data:
